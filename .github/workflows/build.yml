name: Build and Release C++ App

on:
  push:
    tags:
      - 'v*'            # Triggers automatically when you push a version tag like v1.0.0
  workflow_dispatch:     # Allows you to click the manual "Run workflow" button anytime

jobs:
  build:
    runs-on: windows-2022

    # Grants explicit authorization to create releases and upload files
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution in Release Mode
      run: msbuild coclassic.sln /p:Configuration=Release /p:Platform=x64

    - name: Create GitHub Release and Upload Binaries
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || 'v1.0.0-manual' }}
        name: Release ${{ github.ref_name || 'v1.0.0-manual' }}
        draft: false
        prerelease: false
        files: |
          **/Release/*.exe
          **/Release/*.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
